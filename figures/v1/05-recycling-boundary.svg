			<text x="54" y="198" style="font-family: Helvetica-Bold; font-size: 21px;fill: rgb(12%,19%,23%); stroke:none;" transform="translate(0,396) scale(1,-1)">In aluminum-base alloys</text>
			<text x="54" y="173" style="font-family: Helvetica; font-size: 13px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,346) scale(1,-1)">Magnesium stays within an alloy stream.</text>
			<text x="542" y="198" style="font-family: Helvetica-Bold; font-size: 21px;fill: rgb(12%,19%,23%); stroke:none;" transform="translate(0,396) scale(1,-1)">Mg castings, ingot and other</text>
