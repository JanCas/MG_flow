			<text x="54" y="401" style="font-family: Helvetica; font-size: 14px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,802) scale(1,-1)">Forms in which U.S. secondary magnesium was recovered, 2025 estimates</text>
			<text x="54" y="88" style="font-family: Helvetica; font-size: 11.5px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,176) scale(1,-1)">Shares are of recovered magnesium, not the gross weight of aluminum-alloy products.</text>
			<text x="54" y="71" style="font-family: Helvetica; font-size: 11.5px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,142) scale(1,-1)">New and old scrap are included. This is recovery form, not the separate end-use mix.</text>
