			<text x="773.7" y="27" style="font-family: Helvetica; font-size: 10px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,54) scale(1,-1)">Research cutoff: 27 Sep 2026</text>
			<text x="54" y="343" style="font-family: Helvetica; font-size: 14px;fill: rgb(34%,40%,44%); stroke:none;" transform="translate(0,686) scale(1,-1)">Share of recovered secondary magnesium</text>
